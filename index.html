<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Blauschild Stellensuche</title>

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    background: #f4f6f8;
    font-family: 'PT Sans', sans-serif;
}

/* HEADER BIANCO */
.header {
    background: white;
    padding: 20px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #e5e7eb;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 20px;
}

.header img {
    height: 60px;
    cursor: pointer;
}

.header-title {
    font-family: 'rogue-sans', 'PT Sans', sans-serif;
    font-size: 26px;
    font-weight: 500;
    color: #003a8f;
}

.lang-switch button {
    margin-left: 10px;
    padding: 6px 12px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    background: #e5e7eb;
}

/* INTRO BOX */
.page-intro {
    max-width: 900px;
    margin: 40px auto;
    background: #e9eef5;
    padding: 30px;
    border-left: 5px solid #003a8f;
    border-radius: 8px;
}

.page-intro h1 {
    font-family: 'rogue-sans', 'PT Sans', sans-serif;
    color: #003a8f;
    font-size: 2.5rem;
    margin-bottom: 10px;
    font-weight: 500;
}

.page-intro p {
    color: #555;
    font-size: 16px;
}

/* JOB LIST */
.container {
    max-width: 900px;
    margin: 40px auto;
}

.job {
    background: white;
    padding: 25px;
    margin-bottom: 25px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}

.title {
    font-family: 'rogue-sans', 'PT Sans', sans-serif;
    font-size: 20px;
    font-weight: 500;
}

.company {
    color: #6b7280;
    margin-top: 5px;
}

.location {
    margin-top: 10px;
}

.extra {
    display: inline-block;
    margin-top: 10px;
    background: #e5e7eb;
    padding: 6px 10px;
    border-radius: 15px;
    font-size: 13px;
}

.description {
    margin-top: 15px;
}

/* BUTTON */
.button {
    display: inline-block;
    margin-top: 15px;
    background: #003a8f;
    color: white;
    padding: 10px 15px;
    text-decoration: none;
    border-radius: 6px;
    font-family: 'rogue-sans', 'PT Sans', sans-serif;
}

/* CONTACT */
.contact-info {
    margin-top: 10px;
    font-size: 14px;
}

.contact-info a {
    display: block;
    color: #003a8f;
    text-decoration: none;
    margin-top: 5px;
}

</style>

</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="header-left">
        <a href="https://blauschild.it" target="_blank">
            <img src="logo.png" alt="Blauschild Logo">
        </a>
        <div class="header-title">Offene Stellen</div>
    </div>

    <div class="lang-switch">
        <button onclick="setLang('de')">DE</button>
        <button onclick="setLang('it')">IT</button>
    </div>
</div>

<!-- INTRO -->
<div class="page-intro">
    <h1 id="title">Finde deinen Job in einer BLAUSCHILD-Werkstatt</h1>
    <p id="subtitle">
        Hier findest du aktuelle Stellenangebote unserer BLAUSCHILD-Betriebe.
    </p>
</div>

<!-- JOB LIST -->
<div class="container" id="jobs"></div>

<script>

let currentLang = "de";

function setLang(lang) {
    currentLang = lang;
    loadJobs();
}

function loadJobs() {
    fetch('jobs.csv')
    .then(response => response.text())
    .then(data => {

        const container = document.getElementById('jobs');
        container.innerHTML = "";

        const rows = data.split('\n').slice(1);

        rows.forEach(row => {

            const cols = row.split(';');

            if (cols.length < 10) return;

            if (cols[1].trim().toLowerCase() !== "ja") return;

            const company = cols[2];
            const title = currentLang === "de" ? cols[3] : cols[4];
            const location = currentLang === "de" ? cols[5] : cols[6];
            const email = cols[7];
            const tel = cols[8];
            const description = currentLang === "de" ? cols[9] : cols[10];
            const extra = currentLang === "de" ? cols[11] : cols[12];

            const div = document.createElement('div');
            div.className = 'job';

            div.innerHTML = `
                <div class="title">${title}</div>
                <div class="company">${company}</div>
                <div class="location">${location}</div>

                <div class="extra">${extra}</div>

                <div class="description">${description}</div>

                <a class="button" href="mailto:${email}">
                    ${currentLang === "de" ? "Jetzt bewerben" : "Candidati ora"}
                </a>

                <div class="contact-info">
                    <a href="mailto:${email}">✉ ${email}</a>
                    <a href="tel:${tel}">📞 ${tel}</a>
                </div>
            `;

            container.appendChild(div);
        });
    });
}

loadJobs();

</script>

</body>
</html>
