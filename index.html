<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Blauschild Stellensuche</title>

<!-- Libreria per leggere CSV correttamente -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
}

.header {
    background: #003a8f;
    color: white;
    padding: 20px;
    font-size: 24px;
}

.container {
    max-width: 900px;
    margin: 40px auto;
}

.job {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 8px;
}

.title {
    font-size: 20px;
    font-weight: bold;
}

.company {
    color: #555;
    margin-bottom: 5px;
}

.button {
    display: inline-block;
    margin-top: 10px;
    background: #003a8f;
    color: white;
    padding: 10px 15px;
    text-decoration: none;
    border-radius: 5px;
}
</style>

</head>

<body>

<div class="header">
    Offene Stellen – BLAUSCHILD
</div>

<div class="container" id="jobs"></div>

<script>
fetch('jobs.csv')
  .then(response => response.text())
  .then(csvText => {

    Papa.parse(csvText, {
      header: true,
      delimiter: ";",
      skipEmptyLines: true,

      complete: function(results) {

        const container = document.getElementById('jobs');

        results.data.forEach(job => {

          const active = (job["Aktiv"] || "").trim().toLowerCase();

          // mostra solo attivi
          if (active !== "yes" && active !== "ja") return;

          const company = (job["Firmenname"] || "").trim();
          const title = (job["Jobtitel / Stellenbezeichnung_DE"] || "").trim();
          const location = (job["Ort"] || "").trim().replace(/\r?\n/g, ", ");
          const email = (job["Kontakt_Email"] || "").trim();
          const phone = (job["Kontakt_Tel"] || "").trim();
          const description = (job["Stellenbeschreibung_DE"] || "").trim().replace(/\r?\n/g, "<br>");
          const extra = (job["extra_DE"] || "").trim();

          const div = document.createElement('div');
          div.className = 'job';

          div.innerHTML = `
            <div class="title">${title}</div>
            <div class="company">${company}</div>
            <div>${location}</div>
            ${extra ? `<p><strong>${extra}</strong></p>` : ""}
            ${description ? `<p>${description}</p>` : ""}
            ${phone ? `<p>Tel: ${phone}</p>` : ""}
            ${email ? `<a class="button" href="mailto:${email}">Jetzt bewerben</a>` : ""}
          `;

          container.appendChild(div);
        });
      }
    });
});
</script>

</body>
</html>
