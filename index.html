<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offene Stellen in Südtirol | BLAUSCHILD Jobs</title>
<meta name="description" content="Finde offene Stellen in Südtirol bei BLAUSCHILD Werkstätten. Jobs für Mechaniker, Karosserietechniker, Lackierer und Lehrlinge. Jetzt bewerben!">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://jobs.blauschild.it/">
<meta property="og:title" content="Offene Stellen bei BLAUSCHILD">
<meta property="og:description" content="Alle offenen Stellen unserer Werkstätten in Südtirol auf einen Blick.">
<meta property="og:url" content="https://jobs.blauschild.it/">
<meta property="og:type" content="website">
<meta property="og:image" content="https://jobs.blauschild.it/logo-blauschild.jpg">
<meta name="google-site-verification" content="5Pi4rsd3_18yPeqqCgpFvUjIzCYQAc0L6RnWuQJ_NQ0">
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
@font-face {font-family:'RogueSans';src:url('Device%20-%20RogueSans-Medium.otf') format('opentype');font-weight:500;font-style:normal}
body{font-family:'PT Sans',sans-serif;background:#f4f6f8;margin:0;color:#1a1a1a}
.topbar{background:white;border-bottom:1px solid #e6e9ee;padding:20px 34px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
.logo{width:280px;height:auto}
.lang-switch{display:flex;gap:10px}
.lang-switch button{width:42px;height:42px;border-radius:50%;border:1px solid #cfd6df;background:white;color:#7a8490;font-weight:bold;cursor:pointer}
.lang-switch button.active{border-color:#003882;color:#003882;background:#f4f8fc}
.page-wrap{max-width:980px;margin:36px auto;padding:0 20px}
.page-intro{background:white;border-radius:12px;padding:28px 30px;box-shadow:0 4px 12px rgba(0,0,0,.05);margin-bottom:26px}
.page-intro h1{font-size:2.5rem;font-family:'RogueSans',sans-serif;font-weight:500;margin:0 0 10px;color:#003882}
.page-intro p{font-size:16px;line-height:1.5;max-width:850px;margin:0;color:#4a5563}
.job{background:white;padding:24px;margin-bottom:22px;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.05);border:1px solid #e7ebf0}
.job-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:10px}
.job-text{flex:1;min-width:0}
.job-logo{max-width:140px;max-height:55px;object-fit:contain;flex-shrink:0}
.title{font-size:22px;font-family:'RogueSans',sans-serif;font-weight:500;margin-bottom:4px}
.company{color:#5b6572;margin-bottom:0}
.location{margin-bottom:10px}
.extra{display:inline-block;background:#eaf1fb;color:#003882;padding:6px 10px;border-radius:20px;font-size:14px;margin-bottom:10px}
.description{margin:10px 0}
.button{display:inline-block;background:#003882;color:white;padding:10px 14px;border-radius:6px;text-decoration:none;font-family:'RogueSans',sans-serif;font-weight:500;margin-top:8px}
.button:hover{background:#002d6f}
.contact-info{margin-top:10px;line-height:1.8}
.contact-info a{color:#003882;text-decoration:none}
.contact-line{display:block;margin-top:4px;color:#003882}
.icon-blue{color:#003882;display:inline-block;width:18px}
.job-toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}
.job-count{font-family:'RogueSans',sans-serif;font-size:20px;color:#003882}
.city-filter{min-width:210px;padding:10px 38px 10px 12px;border:1px solid #cfd6df;border-radius:7px;background:white;color:#1a1a1a;font-family:'PT Sans',sans-serif;font-size:16px;cursor:pointer}
.city-filter:focus{outline:none;border-color:#003882}
.empty{text-align:center;padding:20px;background:white;border-radius:10px}
.salary-detail{margin-top:10px}
.salary-detail strong{color:#003882}
@media(max-width:700px){.job-toolbar{flex-direction:column;align-items:stretch}.city-filter{width:100%}.job-header{flex-direction:column;align-items:flex-start}.job-logo{margin-top:4px}}
</style>
</head>
<body>
<div class="topbar">
  <a href="https://www.blauschild.it/" target="_blank" rel="noopener noreferrer"><img src="logo-blauschild.jpg" class="logo" alt="Blauschild"></a>
  <div class="lang-switch"><button id="btn-de" class="active" type="button">DE</button><button id="btn-it" type="button">IT</button></div>
</div>
<div class="page-wrap">
  <div class="page-intro"><h1 id="pageTitle">Offene Stellen</h1><p id="pageText">Hier findest du aktuelle Stellenangebote unserer BLAUSCHILD-Betriebe. Entdecke offene Positionen und bewirb dich direkt beim jeweiligen Betrieb.</p></div>
  <div class="job-toolbar"><div id="jobCount" class="job-count"></div><select id="cityFilter" class="city-filter" aria-label="Ort auswählen"><option value="">Ort auswählen...</option></select></div>
  <div id="jobs"></div>
</div>
<script>
'use strict';
let currentLang = 'de';
let cachedJobs = [];
const $ = id => document.getElementById(id);
const str = value => String(value ?? '');
function normalizePhoneForLink(phone) {
  const trimmed = str(phone).trim();
  const normalized = trimmed.replace(/[^\d+]/g, '');
  return /^\+?\d{3,20}$/.test(normalized) ? normalized : '';
}
function validEmail(email) {
  const trimmed = str(email).trim();
  return /^[^\s@<>"']+@[^\s@<>"']+\.[^\s@<>"']+$/.test(trimmed) ? trimmed : '';
}
function extractCity(location) {
  const text = str(location).replace(/\n/g,' ').trim();
  const match = text.match(/\b\d{5}\s+(.+?)(?:\s*\(BZ\))?$/);
  return match ? match[1].trim() : text;
}
function textNode(tag, className, text) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  element.textContent = str(text);
  return element;
}
function multiline(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  str(text).split(/\r?\n/).forEach((line, i) => {
    if (i) el.appendChild(document.createElement('br'));
    el.appendChild(document.createTextNode(line));
  });
  return el;
}
function detail(parent, label, value) {
  if (!str(value).trim()) return;
  const wrap = document.createElement('div');
  wrap.className = 'salary-detail';
  wrap.appendChild(textNode('strong', '', label));
  wrap.appendChild(document.createElement('br'));
  wrap.appendChild(multiline('span', '', value));
  parent.appendChild(wrap);
}
function safeLogoFile(value) {
  const name = str(value).trim();
  // Only filenames within the existing logos directory; no URLs or paths.
  return /^[a-zA-Z0-9_(). -]+\.(?:png|jpe?g|webp|gif|svg)$/i.test(name) ? name : '';
}
function setLang(lang) {
  currentLang = lang === 'it' ? 'it' : 'de';
  document.documentElement.lang = currentLang;
  $('btn-de').classList.toggle('active', currentLang === 'de');
  $('btn-it').classList.toggle('active', currentLang === 'it');
  $('pageTitle').textContent = currentLang === 'de' ? 'Offene Stellen' : 'Offerte di lavoro';
  $('pageText').textContent = currentLang === 'de'
    ? 'Hier findest du aktuelle Stellenangebote unserer BLAUSCHILD-Betriebe. Entdecke offene Positionen und bewirb dich direkt beim jeweiligen Betrieb.'
    : 'Qui trovi le offerte di lavoro attuali delle officine BLAUSCHILD. Scopri le posizioni aperte e candidati direttamente presso l’azienda interessata.';
  renderJobs();
}
function renderJobs() {
  const container = $('jobs');
  container.replaceChildren();
  const cityFilter = $('cityFilter');
  const selectedCity = cityFilter.value;
  const cities = new Map();
  cachedJobs.forEach(job => {
    const key = extractCity(job['Ort']);
    const label = extractCity(currentLang === 'de' ? job['Ort'] : (job['Ort_IT'] || job['Ort']));
    if (key) cities.set(key, label || key);
  });
  cityFilter.replaceChildren(new Option(currentLang === 'de' ? 'Ort auswählen...' : 'Seleziona località...', ''));
  [...cities.entries()].sort((a,b) => a[1].localeCompare(b[1], currentLang))
    .forEach(([key,label]) => cityFilter.add(new Option(label,key)));
  if (cities.has(selectedCity)) cityFilter.value = selectedCity;
  let visible = 0;
  cachedJobs.forEach(job => {
    const cityKey = extractCity(job['Ort']);
    if (selectedCity && cityKey !== selectedCity) return;
    const de = currentLang === 'de';
    const title = job[de ? 'Jobtitel / Stellenbezeichnung_DE' : 'Jobtitel / Stellenbezeichnung_IT'];
    const location = job[de ? 'Ort' : 'Ort_IT'] || (de ? '' : job['Ort']);
    const description = job[de ? 'Stellenbeschreibung_DE' : 'Stellenbeschreibung_IT'];
    const gehalt = job[de ? 'Gehalt_DE' : 'Gehalt_IT'];
    const kollektiv = job[de ? 'Kollektivvertrag_DE' : 'Kollektivvertrag_IT'];
    const einstufung = job[de ? 'Einstufung_DE' : 'Einstufung_IT'];
    const extra = job[de ? 'extra_DE' : 'extra_IT'];
    const company = str(job['Firmenname']).trim();
    const logo = safeLogoFile(job['logo']);
    const email = validEmail(job['Kontakt_Email'] || job['contact_email']);
    const phone = str(job['Kontakt_Tel'] || job['contact_tel']).trim();
    const phoneLink = normalizePhoneForLink(phone);
    const card = textNode('div','job','');
    const header = textNode('div','job-header','');
    const left = textNode('div','job-text','');
    left.appendChild(textNode('div','title',title));
    left.appendChild(textNode('div','company',company));
    header.appendChild(left);
    if (logo) {
      const img = document.createElement('img');
      img.src = 'logos/' + encodeURIComponent(logo);
      img.className = 'job-logo';
      img.alt = company;
      img.addEventListener('error', () => { img.hidden = true; });
      header.appendChild(img);
    }
    card.appendChild(header);
    card.appendChild(multiline('div','location',location));
    detail(card, de ? 'Bruttogehalt' : 'Retribuzione lorda', gehalt);
    detail(card, de ? 'Kollektivvertrag' : 'Contratto collettivo', kollektiv);
    detail(card, de ? 'Einstufung' : 'Inquadramento', einstufung);
    if (str(extra).trim()) {
      const badge = textNode('div','extra',extra);
      badge.style.marginTop = '10px';
      card.appendChild(badge);
    }
    card.appendChild(multiline('div','description',description));
    if (email) {
      const apply = textNode('a','button',de ? 'Jetzt bewerben' : 'Candidati ora');
      apply.href = 'mailto:' + email;
      card.appendChild(apply);
    }
    const contact = textNode('div','contact-info','');
    if (email) {
      const line = textNode('span','contact-line','');
      line.appendChild(textNode('span','icon-blue','✉'));
      line.appendChild(document.createTextNode(' '));
      const link = textNode('a','',email);
      link.href = 'mailto:' + email;
      line.appendChild(link);
      contact.appendChild(line);
    }
    if (phone) {
      const line = textNode('span','contact-line','');
      line.appendChild(textNode('span','icon-blue','☎'));
      line.appendChild(document.createTextNode(' '));
      if (phoneLink) {
        const link = textNode('a','',phone);
        link.href = 'tel:' + phoneLink;
        line.appendChild(link);
      } else line.appendChild(document.createTextNode(phone));
      contact.appendChild(line);
    }
    card.appendChild(contact);
    container.appendChild(card);
    visible++;
  });
  $('jobCount').textContent = currentLang === 'de'
    ? `${visible} ${visible === 1 ? 'offener Job' : 'offene Jobs'}`
    : `${visible} ${visible === 1 ? 'posizione aperta' : 'posizioni aperte'}`;
  if (!visible) container.appendChild(textNode('div','empty',currentLang === 'de'
    ? 'Derzeit sind keine offenen Stellen verfügbar.' : 'Al momento non ci sono posizioni aperte.'));
}
async function loadJobs() {
  try {
    const response = await fetch('jobs.csv', { cache: 'no-store' });
    if (!response.ok) throw new Error('CSV HTTP ' + response.status);
    const csv = await response.text();
    const parsed = Papa.parse(csv, { header:true, delimiter:';', skipEmptyLines:true });
    cachedJobs = parsed.data.filter(job => ['yes','ja'].includes(str(job['Aktiv']).trim().toLowerCase()));
    renderJobs();
  } catch(err) {
    console.error('Unable to load jobs:',err);
    $('jobs').replaceChildren(textNode('div','empty',currentLang === 'de'
      ? 'Fehler beim Laden der Daten.' : 'Errore nel caricamento dei dati.'));
    $('jobCount').textContent = '';
  }
}
$('btn-de').addEventListener('click', () => setLang('de'));
$('btn-it').addEventListener('click', () => setLang('it'));
$('cityFilter').addEventListener('change', renderJobs);
loadJobs();
</script>
</body>
</html>
