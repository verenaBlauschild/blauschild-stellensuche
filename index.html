<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Blauschild Stellensuche</title>

<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'PT Sans', sans-serif;
    background: #f4f6f8;
    margin: 0;
}

/* HEADER */
.header {
    background: #003882;
    color: white;
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h1 {
    margin: 0;
    font-size: 22px;
}

/* LANGUAGE SWITCH */
.lang-switch button {
    margin-left: 10px;
    padding: 6px 10px;
    border: none;
    cursor: pointer;
    background: white;
    color: #003882;
    border-radius: 4px;
    font-weight: bold;
}

/* CONTAINER */
.container {
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
}

/* JOB CARD */
.job {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

.title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 5px;
}

.company {
    color: #555;
    margin-bottom: 10px;
}

.location {
    margin-bottom: 10px;
    color: #333;
}

.description {
    margin-bottom: 10px;
}

/* BUTTON */
.button {
    display: inline-block;
    margin-top: 10px;
    background: #003882;
    color: white;
    padding: 10px 15px;
    text-decoration: none;
    border-radius: 6px;
    margin-right: 10px;
}

.button.secondary {
    background: #e5e8ec;
    color: #003882;
}
</style>

</head>

<body>

<div class="header">
    <h1 id="title">Offene Stellen – BLAUSCHILD</h1>
    <div class="lang-switch">
        <button onclick="setLang('de')">DE</button>
        <button onclick="setLang('it')">IT</button>
    </div>
</div>

<div class="container" id="jobs"></div>

<script>
let currentLang = "de";

function setLang(lang) {
    currentLang = lang;

    document.getElementById("title").innerText =
        lang === "de" ? "Offene Stellen – BLAUSCHILD" : "Offerte di lavoro – BLAUSCHILD";

    loadJobs();
}

function loadJobs() {
    fetch('jobs.csv')
    .then(response => response.text())
    .then(data => {

        const rows = data.split('\n').slice(1);
        const container = document.getElementById('jobs');
        container.innerHTML = "";

        rows.forEach(row => {

            const cols = row.split(',');

            if (cols.length < 13) return;

            const active = cols[1].trim();
            if (active !== "ja") return;

            const company = cols[2];

            const title = currentLang === "de" ? cols[3] : cols[4];
            const location = currentLang === "de" ? cols[5] : cols[6];
            const description = currentLang === "de" ? cols[9] : cols[10];
            const extra = currentLang === "de" ? cols[11] : cols[12];

            const email = cols[7];
            const phone = cols[8];

            const div = document.createElement('div');
            div.className = 'job';

            div.innerHTML = `
                <div class="title">${title}</div>
                <div class="company">${company}</div>
                <div class="location">${location}</div>
                <div class="description">${description}</div>
                <div><strong>${extra}</strong></div>

                ${email ? `<a class="button" href="mailto:${email}">${currentLang === "de" ? "Jetzt bewerben" : "Candidati ora"}</a>` : ""}

                ${phone ? `<a class="button secondary" href="tel:${phone}">${currentLang === "de" ? "Anrufen" : "Chiama"}</a>` : ""}
            `;

            container.appendChild(div);
        });
    });
}

loadJobs();
</script>

</body>
</html>
